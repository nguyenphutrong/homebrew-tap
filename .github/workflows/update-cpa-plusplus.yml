name: Update cpa-plusplus Formula

on:
  repository_dispatch:
    types: [cpa-plusplus-release]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to update (e.g., 7.1.38-plus.3)'
        required: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${{ github.event.client_payload.version }}"
          fi
          # Strip "v" prefix if present
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download and get SHA256 checksums
        id: sha256
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BASE_URL="https://github.com/nguyenphutrong/cpa-plusplus/releases/download/v${VERSION}"
          TMP_DIR="$(mktemp -d)"

          download_and_checksum() {
            local asset="$1"
            local output_name="$2"
            local url="${BASE_URL}/cpa-plusplus_${VERSION}_${asset}.tar.gz"
            local file="${TMP_DIR}/${asset}.tar.gz"

            HTTP_CODE=$(curl -sL -w "%{http_code}" -o "$file" "$url")
            if [ "$HTTP_CODE" != "200" ]; then
              echo "::error::Failed to download ${asset}. HTTP status: $HTTP_CODE"
              exit 1
            fi

            SHA256=$(shasum -a 256 "$file" | cut -d' ' -f1)
            if ! echo "$SHA256" | grep -qE '^[a-f0-9]{64}$'; then
              echo "::error::Invalid SHA256 for ${asset}: $SHA256"
              exit 1
            fi

            echo "${output_name}=$SHA256" >> $GITHUB_OUTPUT
          }

          download_and_checksum "darwin_aarch64" "sha256_darwin_aarch64"
          download_and_checksum "darwin_amd64" "sha256_darwin_amd64"
          download_and_checksum "linux_aarch64" "sha256_linux_aarch64"
          download_and_checksum "linux_amd64" "sha256_linux_amd64"

          rm -rf "$TMP_DIR"

      - name: Update Formula
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA256_DARWIN_AARCH64="${{ steps.sha256.outputs.sha256_darwin_aarch64 }}"
          SHA256_DARWIN_AMD64="${{ steps.sha256.outputs.sha256_darwin_amd64 }}"
          SHA256_LINUX_AARCH64="${{ steps.sha256.outputs.sha256_linux_aarch64 }}"
          SHA256_LINUX_AMD64="${{ steps.sha256.outputs.sha256_linux_amd64 }}"

          cat > Formula/cpa-plusplus.rb << FORMULA_EOF
          class CpaPlusplus < Formula
            desc "OpenAI/Gemini/Claude/Codex compatible API proxy"
            homepage "https://github.com/nguyenphutrong/cpa-plusplus"
            version "${VERSION}"
            license "MIT"

            depends_on "git" => :optional

            on_macos do
              on_arm do
                url "https://github.com/nguyenphutrong/cpa-plusplus/releases/download/v#{version}/cpa-plusplus_#{version}_darwin_aarch64.tar.gz"
                sha256 "${SHA256_DARWIN_AARCH64}"
              end
              on_intel do
                url "https://github.com/nguyenphutrong/cpa-plusplus/releases/download/v#{version}/cpa-plusplus_#{version}_darwin_amd64.tar.gz"
                sha256 "${SHA256_DARWIN_AMD64}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/nguyenphutrong/cpa-plusplus/releases/download/v#{version}/cpa-plusplus_#{version}_linux_aarch64.tar.gz"
                sha256 "${SHA256_LINUX_AARCH64}"
              end
              on_intel do
                url "https://github.com/nguyenphutrong/cpa-plusplus/releases/download/v#{version}/cpa-plusplus_#{version}_linux_amd64.tar.gz"
                sha256 "${SHA256_LINUX_AMD64}"
              end
            end

            def install
              bin.install "cpa-plusplus"
              (etc/"cpa-plusplus").install "config.example.yaml" => "config.yaml"
              pkgshare.install "config.example.yaml"
              doc.install "README.md", "LICENSE"
            end

            service do
              run [opt_bin/"cpa-plusplus", "--config", etc/"cpa-plusplus/config.yaml"]
              keep_alive true
              working_dir var/"cpa-plusplus"
              log_path var/"log/cpa-plusplus/cpa-plusplus.log"
              error_log_path var/"log/cpa-plusplus/cpa-plusplus.err.log"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/cpa-plusplus --help")
            end
          end
          FORMULA_EOF

          # Remove leading indentation (10 spaces) from the formula
          sed -i 's/^          //' Formula/cpa-plusplus.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/cpa-plusplus.rb
          git commit -m "chore: update cpa-plusplus to v${{ steps.version.outputs.version }}"
          git push
