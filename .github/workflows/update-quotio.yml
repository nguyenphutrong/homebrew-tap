name: Update Quotio Cask

on:
  repository_dispatch:
    types: [quotio-release]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to update (e.g., 0.7.0)'
        required: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${{ github.event.client_payload.version }}"
          fi
          # Strip "v" prefix if present
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download and get SHA256
        id: sha256
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          URL="https://github.com/nguyenphutrong/quotio/releases/download/v${VERSION}/Quotio-${VERSION}.dmg"
          
          # Download file and check HTTP status
          HTTP_CODE=$(curl -sL -w "%{http_code}" -o /tmp/quotio.dmg "$URL")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Failed to download DMG. HTTP status: $HTTP_CODE"
            exit 1
          fi
          
          # Calculate SHA256
          SHA256=$(shasum -a 256 /tmp/quotio.dmg | cut -d' ' -f1)
          
          # Validate SHA256 format (64 hex characters)
          if ! echo "$SHA256" | grep -qE '^[a-f0-9]{64}$'; then
            echo "::error::Invalid SHA256: $SHA256"
            exit 1
          fi
          
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          rm -f /tmp/quotio.dmg

      - name: Update Cask
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA256="${{ steps.sha256.outputs.sha256 }}"
          
          cat > Casks/quotio.rb << 'EOF'
cask "quotio" do
  version "VERSION_PLACEHOLDER"
  sha256 "SHA256_PLACEHOLDER"

  url "https://github.com/nguyenphutrong/quotio/releases/download/v#{version}/Quotio-#{version}.dmg"
  name "Quotio"
  desc "Command center for AI coding assistants on macOS"
  homepage "https://github.com/nguyenphutrong/quotio"

  app "Quotio.app"

  zap trash: [
    "~/Library/Application Support/Quotio",
    "~/Library/Caches/Quotio",
    "~/Library/Preferences/com.nguyenphutrong.quotio.plist",
  ]
end
EOF
          
          # Replace placeholders
          sed -i "s/VERSION_PLACEHOLDER/$VERSION/" Casks/quotio.rb
          sed -i "s/SHA256_PLACEHOLDER/$SHA256/" Casks/quotio.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/quotio.rb
          git commit -m "chore: update quotio to v${{ steps.version.outputs.version }}"
          git push
